class cfgSkeletons
{
	class geb_jonboatSkeleton
	{
		skeletonInherit = "";
		isDiscrete = 1;
		SkeletonBones[]=
		{
			"crewdriver"	,"",
			"antiwater"	,"",
			"crewcargo1"	,"",
			"crewcargo2"	,"",
			"crewcargo3"	,"",
			"engine"	,"",
			"drivingwheel"	,"engine",
			"propeller"	,"engine"
		};
	};
	// The boat trailer, a vehicle: each wheel proxy sits in its wheel bone, on
	// its spring (damper) bone, as vanilla's cars have them; the jack's inner
	// leg winds up when it is hitched.
	class geb_boattrailer_skeleton
	{
		skeletonInherit = "";
		isDiscrete = 1;
		SkeletonBones[]=
		{
			"wheel_1_2_damper"	,"",
			"wheel_1_2"	,"wheel_1_2_damper",
			"wheel_2_2_damper"	,"",
			"wheel_2_2"	,"wheel_2_2_damper",
			"jack_inner"	,"",
			"crewdriver"	,""
		};
	};
};
class CfgModels
{
	class Default
	{
		sections[] = {};
		sectionsInherit="";
		skeletonName = "";
	};
	class geb_jonboat:Default
	{
		skeletonName="geb_jonboatSkeleton";
		sections[]=
		{
			"engine",
			"dmgzone_rightfloat",
			"dmgzone_leftfloat",
			"dmgzone_frontfloat",
			"antiwater",
			"drivingwheel",
			"propeller",
			"BoatCamo",
			"MotorCamo",
			"geb_lights"
		};

/*<potential axis>
