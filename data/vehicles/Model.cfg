</potential axis>*/
		class Animations
		{
			class EngineSteering
			{
				type="rotation";
				source="steeringwheel";
				selection="engine";
				axis="engine_axis";//*probably*
//				sourceAddress = clamp;// (default)
				minValue = -1.0;//rad -57.29578
				maxValue = 1.0;//rad 57.29578
				angle0 = 0.36651915;//rad 21.0;
				angle1 = -0.36651915;//rad -21.0;
//				memory = true;//(default assumed)
			};
			// Motor tilt, as vanilla's rubber boat has it: the whole motor turns on
			// a sideways pin at the top of the transom clamp (axis_folding, set by
			// tools/trailer/jonboat_tilt_axis.py), on the same bone as the steering
			// and listed after it as vanilla does. EngineFolding copies vanilla's
			// (engine source "tilt", -5 to +30 deg); TrailerTilt is the boat
			// trailer's (FoldingEngine, set by geb_boattrailer.c: 25 deg while the
			// boat is on the trailer). The two add up; 30 deg is about as far as the
			// cowling clears the fuel tank and battery box. Positive angles swing
			// the lower unit up and aft.
			class EngineFolding
			{
				type="rotation";
				source="tilt";
				selection="engine";
				axis="axis_folding";
				memory=1;
				minValue=-0.08726646;
				maxValue=1;
				angle0=-0.08726646;
				angle1=0.5235988;
			};
			class TrailerTilt
			{
				type="rotation";
				source="FoldingEngine";
				selection="engine";
				axis="axis_folding";
				memory=1;
				minValue=0;
				maxValue=1;
				angle0=0;
				angle1=0.43633231;
			};
			// The tiller (a child of the motor) turns back about the same pin, so it
			// stays level instead of swinging down through the stern deck.
			class TillerFolding: EngineFolding
			{
				selection="drivingwheel";
				angle0=0.08726646;
				angle1=-0.5235988;
			};
			class TillerTrailerTilt: TrailerTilt
			{
				selection="drivingwheel";
				angle1=-0.43633231;
			};
			class Propeller
			{
				type="rotation";
				source="propellerpos";
				selection="propeller";
				axis="propeller_axis";//*probably*
				sourceAddress = loop;
				minValue = 0.0;//rad 0.0
				maxValue = 6.2831855;//rad 360.0
				angle0 = 0.0;//rad 0.0;
				angle1 = -6.2831855;//rad -360.0;
//				memory = true;//(default assumed)
			};
			class Antiwater
			{
				type="hide";
				source="hideantiwater";
				selection="antiwater";
//				sourceAddress = clamp;// (default)
				minValue = 0.0;//rad 0.0
				maxValue = 1.0;//rad 57.29578
				hideValue = 0.99;
			};
		};//</Animations>
	};//</Modelclass>
	class boattrailer:Default
	{
		skeletonName="geb_boattrailer_skeleton";
		sections[]=
		{
			"camo",
			"lights"
		};
		class Animations
		{
			// The engine drives these (config SimulationModule, Rear axle): the
			// wheels' turn (wheelbackleft/right, 0..2 pi a turn, the sign
			// vanilla's wheels use) and the springs (damper_1_2/2_2: 0 = 8 cm
			// down, 1 = 8 cm up, the axle's travelMaxDown/Up).
			class Wheel_1_2
			{
				type="rotation";
				source="wheelbackleft";
				selection="wheel_1_2";
				axis="wheel_1_2_axis";
				memory=1;
				sourceAddress="loop";
				minValue=0;
				maxValue=6.2831855;
				angle0=0;
				angle1=-6.2831855;
			};
			class Wheel_2_2: Wheel_1_2
			{
				source="wheelbackright";
				selection="wheel_2_2";
				axis="wheel_2_2_axis";
			};
			class Damper_1_2
			{
				type="translation";
				source="damper_1_2";
				selection="wheel_1_2_damper";
				axis="damper_axis";
				memory=1;
				minValue=0;
				maxValue=1;
				offset0=-0.08;
				offset1=0.08;
			};
			class Damper_2_2: Damper_1_2
			{
				source="damper_2_2";
				selection="wheel_2_2_damper";
			};
			// translationY moves by the source value in metres: jackraise goes
			// 0..0.22 (the script sets the phase to 0.22 when hitched)
			class JackRaise
			{
				type="translationY";
				source="jackraise";
				selection="jack_inner";
				minValue=0;
				maxValue=0.22;
			};
		};
	};
};//</CfgModels>
