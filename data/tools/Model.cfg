	// The fly, spincast and baitcast rods (built by tools/rods). Like vanilla's
	// telescopic fishing_rod.p3d, AnimateRod slides the five sections out along +Y
	// while fishing. A translationY moves its selection by the animation value
	// itself, clamped to minValue..maxValue (DayZ reads offset0/offset1 only for
	// type "translation"), so maxValue is each section's travel in metres:
	// vanilla's own 0.8 / 0.7 / 0.55 / 0.37 / 0.2. All sections slide together
	// and the thicker ones stop first.
	class flyfishingrod: Default
	{
		skeletonName = "geb_telescopicrod_skeleton";
		sections[]=
		{
			"camo"
		};
		class Animations
		{
			class Anim1Stage
			{
				type = "translationY";
				source = "animaterod";
				selection = "1st_stage";
				minValue = 0;
				maxValue = 0.8;
			};
			class Anim2Stage: Anim1Stage
			{
				selection = "2nd_stage";
				maxValue = 0.7;
			};
			class Anim3Stage: Anim1Stage
			{
				selection = "3rd_stage";
				maxValue = 0.55;
			};
			class Anim4Stage: Anim1Stage
			{
				selection = "4th_stage";
				maxValue = 0.37;
			};
			class Anim5Stage: Anim1Stage
			{
				selection = "5th_stage";
				maxValue = 0.2;
			};
		};
	};
	class spincastfishingrod: flyfishingrod {};
	class baitcastfishingrod: flyfishingrod {};
	// The heavy surf rod's sections are longer (they start deep in the handle)
