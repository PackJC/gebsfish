class CfgModels
{
	class Default
	{
		sections[]={};
		sectionsInherit="";
	};
	class fishknife: Default
	{
		sections[]=
		{
			"Camo"
		};
	};
	// "placing" is the selection the placement hologram recolours. A selection
	// listed in hiddenSelections[] (geb_WoodenFishMount in config.cpp) can only
	// have its material swapped at runtime if it is ALSO declared as a section
	// here -- exactly the pairing fishknife uses for "Camo" above. Without this
	// entry Hologram.RefreshVisual still runs and still calls SetObjectMaterial,
	// but there is no swappable section for it to land on, so the projection
	// renders as the normal textured plaque instead of the white ghost that
	// every other placeable shows.
	class fishmount: Default
	{
		sections[]=
		{
			"placing"
		};
	};
};