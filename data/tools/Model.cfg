class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class geb_fishmount_skeleton: Default
	{
		skeletonBones[] =
		{
			"fish_move", "",
			"fish_yaw", "fish_move",
			"fish_pitch", "fish_yaw",
			"fish_roll", "fish_pitch"
		};
	};
};
class CfgModels
{
	class Default
	{
		sections[]={};
		sectionsInherit="";
	};
	class fishknife: Default
	{
		sections[]=
		{
			"Camo"
		};
	};
	class bamboofishingnet: Default
	{
		sections[]=
		{
			"Camo"
		};
	};
	// The fish mounts (geb_fishmount.c). A mounted fish rides the gebfishmount
	// proxy, which sits in fish_roll inside fish_pitch inside fish_yaw inside
	// fish_move. Child bones turn first, so the script's pose is translate * yaw *
	// pitch * roll about the display point on the board's face, whatever order the
	// engine keeps the animations in. Every axis runs from the display point
	// (the first memory point) one metre along +X, +Y or +Z; the engine turns by
	// the right-hand rule about that direction and moves along it by
	// offset * axis length. Phases: translations 0.5 + metres / 4 (0.5 is no
	// shift), turns degrees / 360 (geb_fishmountposes.c holds every species).
	//
	// "placing" is the selection the placement hologram recolours. A selection
	// listed in hiddenSelections[] can only have its material swapped at runtime
	// if it is ALSO declared as a section here, the pairing fishknife uses for
	// "Camo" above; without it the projection renders as the normal textured
	// board instead of the white ghost every other placeable shows.
	class smallfishmount: Default
	{
		skeletonName = "geb_fishmount_skeleton";
		sections[]=
		{
			"placing"
		};
		class Animations
		{
			class fish_x
			{
				type = "translation";
				source = "fish_x";
				selection = "fish_move";
				axis = "axis_move_x";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = -2;
				offset1 = 2;
			};
			class fish_y
			{
				type = "translation";
				source = "fish_y";
				selection = "fish_move";
				axis = "axis_move_y";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = -2;
				offset1 = 2;
			};
			class fish_z
			{
				type = "translation";
				source = "fish_z";
				selection = "fish_move";
				axis = "axis_move_z";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = -2;
				offset1 = 2;
			};
			class fish_yaw
			{
				type = "rotation";
				source = "fish_yaw";
				selection = "fish_yaw";
				axis = "axis_yaw";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = 6.2831855;
			};
			class fish_pitch
			{
				type = "rotation";
				source = "fish_pitch";
				selection = "fish_pitch";
				axis = "axis_pitch";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = 6.2831855;
			};
			class fish_roll
			{
				type = "rotation";
				source = "fish_roll";
				selection = "fish_roll";
				axis = "axis_roll";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = 6.2831855;
			};
		};
	};
	class mediumfishmount: smallfishmount {};
	class largefishmount: smallfishmount {};
};
