	// Fish Tank (geb_FishTank, a trader item): four mini reef fish swim loops on the engine clock
	// (source "time" = AnimationSourceTime, no script). Each fish: orbit (loop, one lap per maxValue
	// seconds) > bob (2 cm axis, mirror) > body sway > tail > tail tip (mirror; minValue sets the phase).
	// Positive angles turn clockwise seen from above, so an anticlockwise lap is -2pi. The water surface
	// rocks slightly so its reflections move; a snail and a crab creep on long mirror loops. "placing" is the
	// hologram's section (the opaque atlas); "light_strip" the hood light, swapped on/off by geb_fishtank.c.
	class fishtank: Default
	{
		skeletonName = "geb_fishtank_skeleton";
		sections[]=
		{
			"placing",
			"light_strip"
		};
		class Animations
		{
			// fish1: siamesetigerfish, 9 cm, lap 6 s anticlockwise, radius 8.8 cm
			class fish1_orbit
			{
				type = "rotation";
				source = "time";
				sourceAddress = "loop";
				selection = "fish1_orbit";
				axis = "fish1_orbit_axis";
				memory = 1;
				minValue = 0;
				maxValue = 6;
				angle0 = 0;
				angle1 = -6.2831855;
			};
			class fish1_bob
			{
				type = "translation";
				source = "time";
				sourceAddress = "mirror";
				selection = "fish1_bob";
				axis = "fish1_bob_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1.5;
				offset0 = -0.5;
				offset1 = 0.5;
			};
			class fish1_sway
			{
				type = "rotation";
				source = "time";
				sourceAddress = "mirror";
				selection = "fish1_body";
				axis = "fish1_body_axis";
				memory = 1;
				minValue = 1.125;
				maxValue = 1.875;
				angle0 = -0.0698132;
				angle1 = 0.0698132;
			};
			class fish1_tail
			{
				type = "rotation";
				source = "time";
				sourceAddress = "mirror";
